name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo build --release --bins
      - name: Package checksums
        shell: pwsh
        run: |
          $files = @(
            "target/release/jinfu-search.exe",
            "target/release/jinfu-search-mcp.exe",
            "target/release/jinfu-search-cli.exe"
          )
          Get-FileHash -Algorithm SHA256 $files |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Encoding ascii "target/release/SHA256SUMS.txt"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/jinfu-search.exe
            target/release/jinfu-search-mcp.exe
            target/release/jinfu-search-cli.exe
            target/release/SHA256SUMS.txt
